<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Вход — Крестики-нолики</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
      <path d="M5 5 L13 13 M13 5 L5 13" stroke="#5E9FE8" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="19.5" cy="19.5" r="6.5" stroke="#DE9255" stroke-width="2.6"/>
    </svg>
    <div>
      <div class="brand-title">Крестики-нолики</div>
      <div class="brand-sub">на Supabase</div>
    </div>
  </div>
</header>

<main class="auth-wrap">
  <div class="card auth-card">
    <h1>Сыграем?</h1>
    <p class="muted">Войдите, чтобы сохранять статистику, играть по сети и попадать в таблицу лидеров.</p>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="signin" type="button">Вход</button>
      <button class="tab" data-tab="signup" type="button">Регистрация</button>
    </div>

    <form id="form-signin">
      <div class="field">
        <label for="si-email">Email</label>
        <input id="si-email" type="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="si-pass">Пароль</label>
        <input id="si-pass" type="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button class="btn primary" style="width:100%" type="submit" id="si-btn">Войти</button>
    </form>

    <form id="form-signup" hidden>
      <div class="field">
        <label for="su-name">Имя игрока</label>
        <input id="su-name" type="text" required maxlength="30" placeholder="Как вас называть?" />
      </div>
      <div class="field">
        <label for="su-email">Email</label>
        <input id="su-email" type="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="su-pass">Пароль</label>
        <input id="su-pass" type="password" required minlength="6" autocomplete="new-password" placeholder="Минимум 6 символов" />
      </div>
      <button class="btn primary" style="width:100%" type="submit" id="su-btn">Создать аккаунт</button>
    </form>

    <div id="auth-msg" class="msg" hidden></div>
    <p class="fine">Аккаунт и статистика хранятся в Supabase-проекте «krestikinoliki».</p>
  </div>
</main>

<script src="app.js"></script>
<script>
TT.initAuthPage({
  onNoSdk: function () {
    var m = TT.$('auth-msg');
    m.textContent = 'Не удалось загрузить Supabase SDK. Проверьте подключение к интернету и перезагрузите страницу.';
    m.className = 'msg error';
    m.hidden = false;
  }
});
</script>
</body>
</html>
